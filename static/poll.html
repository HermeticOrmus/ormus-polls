<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Encuestas</title>
  <style>
    :root {
      --obsidian: #0B0B0D;
      --surface: #111114;
      --surface2: #1a1a1f;
      --surface3: #222228;
      --gold: #D29E3D;
      --gold-dim: rgba(210, 158, 61, 0.15);
      --gold-glow: rgba(210, 158, 61, 0.25);
      --copper: #C87A3B;
      --parchment: #FAF6F0;
      --muted: #777;
      --danger: #c0392b;
      --success: #2ecc71;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--obsidian);
      color: var(--parchment);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(210, 158, 61, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(11, 11, 13, 0.8) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      padding: 24px 16px 48px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .header .subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Google Sign-In button */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 24px;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .google-btn:hover {
      background: var(--gold-dim);
      border-color: var(--copper);
      color: var(--parchment);
    }

    .google-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .google-btn .g-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.7;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--obsidian);
    }

    .btn-primary:hover {
      background: var(--copper);
    }

    .btn-primary:disabled {
      background: var(--surface3);
      color: var(--muted);
      cursor: not-allowed;
    }

    .btn-block { width: 100%; }

    .counter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--obsidian);
      border: 1px solid var(--surface2);
      border-radius: 6px;
      margin-bottom: 20px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .counter-text {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .counter-num {
      font-size: 1.1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }

    .counter-num.under { color: var(--copper); }
    .counter-num.exact { color: var(--success); }
    .counter-num.over { color: var(--danger); }

    .entry {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      min-height: 48px;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    .entry:hover {
      border-color: var(--surface3);
      background: var(--surface2);
    }

    .entry.selected {
      border-color: var(--gold);
      background: var(--gold-dim);
    }

    .entry.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .entry.disabled:hover {
      border-color: var(--surface2);
      background: var(--surface);
    }

    .check {
      width: 20px;
      height: 20px;
      border: 2px solid var(--surface3);
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .radio .check {
      border-radius: 50%;
    }

    .radio .entry.selected .check {
      border-color: var(--gold);
      background: transparent;
    }

    .radio .entry.selected .check::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
    }

    .radio .entry.selected .check svg {
      display: none;
    }

    .entry.selected .check {
      background: var(--gold);
      border-color: var(--gold);
    }

    .check svg {
      width: 12px;
      height: 12px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .entry.selected .check svg {
      opacity: 1;
    }

    .entry-name {
      font-size: 0.88rem;
      font-weight: 400;
      flex: 1;
    }

    .entry-num {
      font-size: 0.7rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 18px;
      text-align: right;
    }

    .entry.taken {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .entry.taken:hover {
      border-color: var(--surface2);
      background: var(--surface);
    }

    .entry.taken .entry-taken-by {
      font-size: 0.68rem;
      color: var(--muted);
      font-style: italic;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.82rem;
      color: var(--parchment);
      z-index: 100;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error { border-color: var(--danger); color: var(--danger); }
    .toast.success { border-color: var(--success); color: var(--success); }

    .confirmation {
      text-align: center;
      padding: 40px 20px;
    }

    .confirmation .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirmation .icon svg {
      width: 24px;
      height: 24px;
      color: var(--gold);
    }

    .confirmation h2 {
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .confirmation p {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .confirmation .change-link {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.78rem;
      color: var(--gold);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .voter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.78rem;
    }

    .voter-bar .name {
      color: var(--parchment);
      font-weight: 500;
    }

    .voter-bar .email {
      color: var(--muted);
    }

    .voter-bar .logout {
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      font-size: 0.72rem;
    }

    .voter-bar .logout:hover {
      color: var(--parchment);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--gold); }

    .hidden { display: none !important; }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 480px) {
      .container {
        padding: 16px 12px calc(32px + env(safe-area-inset-bottom, 0px));
      }
      .card { padding: 16px; }
      .header { margin-bottom: 24px; }
      .header h1 { font-size: 1.2rem; }
      .entry { padding: 14px 12px; gap: 10px; }
      .entry-name { font-size: 0.84rem; }
      .counter { top: 0; border-radius: 0 0 6px 6px; margin-left: -16px; margin-right: -16px; padding: 10px 16px; }
      .google-btn { padding: 14px 24px; font-size: 0.85rem; }
      .btn { padding: 14px 24px; }
      .toast { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); }
      .voter-bar { flex-direction: column; gap: 6px; align-items: flex-start; }
      .voter-bar .logout { align-self: flex-end; margin-top: -20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">&larr; Todas las encuestas</a>

    <div class="header">
      <h1 id="poll-title">Cargando...</h1>
    </div>

    <!-- Loading -->
    <div id="loading-section">
      <div class="card"><div class="loading">Cargando...</div></div>
    </div>

    <!-- Login Section -->
    <div id="login-section" class="hidden">
      <div class="card">
        <div class="card-title">Inicia sesion para votar</div>
        <div class="card-desc" id="poll-description"></div>

        <button class="google-btn" id="google-btn" onclick="signInWithGoogle()">
          <svg class="g-icon" viewBox="0 0 24 24">
            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" opacity=".6"/>
            <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" opacity=".7"/>
            <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" opacity=".5"/>
            <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" opacity=".8"/>
          </svg>
          Continuar con Google
        </button>
      </div>
    </div>

    <!-- Voting Section -->
    <div id="vote-section" class="hidden">
      <div class="voter-bar">
        <div>
          <span class="name" id="voter-name"></span>
          <span class="email" id="voter-email"></span>
        </div>
        <span class="logout" onclick="signOut()">salir</span>
      </div>

      <div class="card">
        <div class="card-title" id="vote-card-title"></div>
        <div class="card-desc" id="vote-card-desc"></div>

        <div class="counter">
          <span class="counter-text">Seleccionados</span>
          <span class="counter-num under" id="counter">0 / 14</span>
        </div>

        <div id="entries-list"></div>

        <button class="btn btn-primary btn-block" id="submit-btn" disabled onclick="submitVote()">
          Enviar Voto
        </button>
      </div>
    </div>

    <!-- Confirmation Section -->
    <div id="confirm-section" class="hidden">
      <div class="card confirmation">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2>Voto Registrado</h2>
        <p id="confirm-text"></p>
        <span class="change-link" onclick="showVoting()">Cambiar mi voto</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="/api/config.js"></script>

  <script>
    firebase.initializeApp(window.FIREBASE_CONFIG);

    const auth = firebase.auth();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    let poll = null;
    let voter = null;
    let firebaseUser = null;
    let idToken = null;
    let selected = new Set();

    const slug = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');

    // Load poll data
    async function loadPoll() {
      try {
        const res = await fetch(`/api/polls/${slug}`);
        if (!res.ok) throw new Error('Not found');
        poll = await res.json();

        document.title = poll.title;
        document.getElementById('poll-title').textContent = poll.title;
        document.getElementById('poll-description').textContent = poll.description || '';

        const req = poll.required_selections;
        const total = poll.entries.length;
        if (req === 1) {
          document.getElementById('vote-card-title').textContent =
            `Selecciona 1 de ${total}`;
          document.getElementById('vote-card-desc').textContent =
            'Elige una opcion. Puedes cambiar tu voto en cualquier momento.';
          document.getElementById('confirm-text').textContent =
            'Tu seleccion ha sido guardada. Puedes regresar y cambiar tu voto en cualquier momento.';
        } else {
          document.getElementById('vote-card-title').textContent =
            `Selecciona ${req} de ${total}`;
          document.getElementById('vote-card-desc').textContent =
            `Elige exactamente ${req} opciones. Puedes cambiar tu voto en cualquier momento.`;
          document.getElementById('confirm-text').textContent =
            `Tus ${req} selecciones han sido guardadas. Puedes regresar y cambiar tu voto en cualquier momento.`;
        }
      } catch (err) {
        document.getElementById('loading-section').innerHTML =
          '<div class="card"><div class="loading">Encuesta no encontrada.</div></div>';
      }
    }

    loadPoll().then(() => {
      if (!poll) return;

      auth.onAuthStateChanged(async (user) => {
        document.getElementById('loading-section').classList.add('hidden');

        if (user) {
          firebaseUser = user;
          idToken = await user.getIdToken();

          const displayName = user.displayName || '';
          const parts = displayName.split(' ');
          const firstName = parts[0] || '';
          const lastName = parts.slice(1).join(' ') || '';

          try {
            const res = await fetch('/api/voter', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${idToken}`,
              },
              body: JSON.stringify({ email: user.email, firstName, lastName, pollId: poll.id }),
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            voter = data.voter;
            selected = new Set(data.existingVotes);

            if (data.existingVotes.length > 0) {
              showVoting();
              toast('Bienvenido de vuelta \u2014 tus selecciones anteriores estan cargadas', 'success');
            } else {
              showVoting();
            }
          } catch (err) {
            toast(err.message || 'Error al registrar votante', 'error');
            document.getElementById('login-section').classList.remove('hidden');
          }
        } else {
          firebaseUser = null;
          idToken = null;
          voter = null;
          selected = new Set();
          document.getElementById('login-section').classList.remove('hidden');
          document.getElementById('vote-section').classList.add('hidden');
          document.getElementById('confirm-section').classList.add('hidden');
        }
      });
    });

    async function signInWithGoogle() {
      const btn = document.getElementById('google-btn');
      btn.disabled = true;
      try {
        await auth.signInWithPopup(googleProvider);
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          toast(err.message || 'Error al iniciar sesion', 'error');
        }
      } finally {
        btn.disabled = false;
      }
    }

    async function signOut() {
      await auth.signOut();
    }

    function renderEntries() {
      const list = document.getElementById('entries-list');
      list.innerHTML = '';
      if (poll.required_selections === 1) list.classList.add('radio');

      const taken = poll.takenEntries || {};

      poll.entries.forEach((name, i) => {
        const div = document.createElement('div');
        const isSelected = selected.has(name);
        const takenBy = taken[name];
        const isTakenByOther = takenBy && voter && takenBy.voterId !== voter.id;

        div.className = 'entry' + (isSelected ? ' selected' : '');

        if (isTakenByOther) {
          div.classList.add('taken');
        } else if (selected.size >= poll.required_selections && !isSelected) {
          div.classList.add('disabled');
        }

        const takenLabel = isTakenByOther
          ? `<span class="entry-taken-by">${takenBy.name}</span>`
          : '';

        div.innerHTML = `
          <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;gap:2px">
            <span class="entry-name">${name}</span>
            ${takenLabel}
          </div>
          <span class="entry-num">${i + 1}</span>
        `;

        if (!isTakenByOther) {
          div.addEventListener('click', () => toggle(name));
        }
        list.appendChild(div);
      });

      updateCounter();
    }

    function toggle(name) {
      if (selected.has(name)) {
        selected.delete(name);
      } else if (poll.required_selections === 1) {
        selected.clear();
        selected.add(name);
      } else if (selected.size < poll.required_selections) {
        selected.add(name);
      }
      renderEntries();
    }

    function updateCounter() {
      const el = document.getElementById('counter');
      const btn = document.getElementById('submit-btn');
      const req = poll.required_selections;
      el.textContent = `${selected.size} / ${req}`;

      el.className = 'counter-num';
      if (selected.size === req) {
        el.classList.add('exact');
        btn.disabled = false;
      } else if (selected.size > req) {
        el.classList.add('over');
        btn.disabled = true;
      } else {
        el.classList.add('under');
        btn.disabled = true;
      }
    }

    async function submitVote() {
      if (selected.size !== poll.required_selections) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        idToken = await firebaseUser.getIdToken(true);

        const res = await fetch('/api/vote', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${idToken}`,
          },
          body: JSON.stringify({ voterId: voter.id, pollId: poll.id, selections: [...selected] }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // Refresh poll data to get updated taken entries
        try {
          const refreshRes = await fetch(`/api/polls/${slug}`);
          if (refreshRes.ok) poll = await refreshRes.json();
        } catch (_) {}

        document.getElementById('vote-section').classList.add('hidden');
        document.getElementById('confirm-section').classList.remove('hidden');
      } catch (err) {
        // Re-fetch taken entries on conflict to show updated state
        if (err.message.includes('ya fue elegido')) {
          try {
            const refreshRes = await fetch(`/api/polls/${slug}`);
            if (refreshRes.ok) { poll = await refreshRes.json(); renderEntries(); }
          } catch (_) {}
        }
        toast(err.message || 'Error al enviar voto', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar Voto';
      }
    }

    function showVoting() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('confirm-section').classList.add('hidden');
      document.getElementById('vote-section').classList.remove('hidden');

      document.getElementById('voter-name').textContent = `${voter.firstName} ${voter.lastName}`;
      document.getElementById('voter-email').textContent = ` \u2014 ${voter.email}`;

      renderEntries();
    }

    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (type ? ` ${type}` : '');
      setTimeout(() => el.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
